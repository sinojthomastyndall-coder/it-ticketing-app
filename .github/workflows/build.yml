name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create cordova-app com.example.itticketing ITTicketingApp
          
          # Clean default Cordova web files
          rm -rf cordova-app/www/*

          # Copy web app content safely
          mkdir -p build_assets
          cp -r * build_assets/ 2>/dev/null || true
          rm -rf build_assets/cordova-app build_assets/.github build_assets/.git build_assets/app build_assets/*.gradle* build_assets/*.kts
          cp -r build_assets/* cordova-app/www/

          cd cordova-app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Ticketing-App
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
