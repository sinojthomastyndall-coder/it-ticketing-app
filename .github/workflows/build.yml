name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create cordova-app com.example.itticketing ITTicketingApp
          
          # Clean default Cordova web files
          rm -rf cordova-app/www/*

          # Safely copy repo files to temporary location
          mkdir -p temp_www
          cp -r * temp_www/ 2>/dev/null || true
          rm -rf temp_www/cordova-app temp_www/.github temp_www/.git temp_www/app temp_www/*.gradle* temp_www/*.kts
          
          # Copy remaining web assets to Cordova www
          cp -r temp_www/* cordova-app/www/

          # Configure Cordova config.xml to use file scheme instead of https://localhost
          cd cordova-app
          sed -i 's|</widget>|<preference name="AndroidInsecureFileModeEnabled" value="true" /><preference name="Scheme" value="file" /><preference name="Hostname" value="localhost" /></widget>|' config.xml

          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Ticketing-App
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
