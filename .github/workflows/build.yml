name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create cordova-app com.example.itticketing ITTicketingApp
          
          # Empty default Cordova web directory
          rm -rf cordova-app/www/*

          # Find where index.html lives and copy its parent folder contents to www/
          INDEX_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "*/cordova-app/*" | head -n 1)
          
          if [ -n "$INDEX_PATH" ]; then
            WEB_DIR=$(dirname "$INDEX_PATH")
            echo "Found web content directory at: $WEB_DIR"
            cp -r $WEB_DIR/* cordova-app/www/
          else
            echo "No index.html found directly; copying repository root..."
            cp -r * cordova-app/www/ 2>/dev/null || true
          fi

          # Clean build artifacts out of www/
          rm -rf cordova-app/www/cordova-app cordova-app/www/.github cordova-app/www/.git cordova-app/www/app

          # Configure Cordova scheme settings
          cd cordova-app
          sed -i 's|</widget>|<preference name="AndroidInsecureFileModeEnabled" value="true" /><preference name="Scheme" value="file" /><preference name="Hostname" value="localhost" /></widget>|' config.xml

          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Ticketing-App
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
