name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create cordova-app com.example.itticketing ITTicketingApp
          
          # Remove default template files
          rm -rf cordova-app/www/*
          
          # Copy web frontend files (index.html, CSS, JS, assets) into www/
          cp -r index.html *.css *.js assets/ cordova-app/www/ 2>/dev/null || cp -r index.html *.css *.js cordova-app/www/ 2>/dev/null || cp -r * cordova-app/www/ 2>/dev/null
          
          # Remove gradle artifacts if copied
          rm -rf cordova-app/www/cordova-app cordova-app/www/.github cordova-app/www/app cordova-app/www/*.gradle*
          
          cd cordova-app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IT-Ticketing-App
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
