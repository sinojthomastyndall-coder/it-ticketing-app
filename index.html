<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Jobs To Do</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .modal-animate { transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out; }
        .card-transition { transition: all 0.2s ease-in-out; }
        .card-transition:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 min-h-screen pb-12">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-indigo-400">My Jobs To Do</h1>
            <p class="text-xs text-slate-400">IT Support Dashboard</p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition-all duration-200 flex items-center gap-1">
                📊 Export Excel
            </button>
            <button onclick="openCreateModal()" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition-all duration-200">
                + New Ticket
            </button>
        </div>
    </div>

    <!-- Stats Overview -->
    <div class="grid grid-cols-3 gap-3 mb-6 text-center">
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-sm">
            <span class="block text-2xl font-bold text-amber-400" id="stat-open">0</span>
            <span class="text-xs text-slate-400">Open</span>
        </div>
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-sm">
            <span class="block text-2xl font-bold text-blue-400" id="stat-progress">0</span>
            <span class="text-xs text-slate-400">In Progress</span>
        </div>
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-sm">
            <span class="block text-2xl font-bold text-emerald-400" id="stat-resolved">0</span>
            <span class="text-xs text-slate-400">Resolved</span>
        </div>
    </div>

    <!-- Ticket List -->
    <div id="ticket-list" class="space-y-3"></div>

    <!-- Create/Edit Ticket Modal -->
    <div id="modal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 hidden z-50 opacity-0 modal-animate">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold text-slate-100 mb-4" id="modal-title">Create Ticket</h2>
            
            <input type="hidden" id="t-id">

            <!-- End User Name -->
            <label class="block text-xs text-slate-400 mb-1">End User Name</label>
            <input type="text" id="t-end-user" placeholder="e.g. John Doe" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-3 focus:outline-none focus:border-indigo-500 transition-colors">

            <!-- Subject Dropdown -->
            <label class="block text-xs text-slate-400 mb-1">Subject</label>
            <select id="t-subject" onchange="handleSubjectChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-3 focus:outline-none focus:border-indigo-500 transition-colors">
                <option value="Software Installation">Software Installation</option>
                <option value="Faulty Hardware">Faulty Hardware</option>
                <option value="Login Error">Login Error</option>
                <option value="PC Intune">PC Intune</option>
                <option value="Laptop Intune">Laptop Intune</option>
                <option value="New Laptop">New Laptop</option>
                <option value="Desk Settings">Desk Settings</option>
                <option value="Others">Others</option>
            </select>

            <!-- Dynamic Sub-field: Laptop Size -->
            <div id="wrapper-laptop-size" class="hidden mb-3">
                <label class="block text-xs text-indigo-400 mb-1 font-semibold">Laptop Size</label>
                <select id="t-laptop-size" class="w-full bg-slate-900 border border-indigo-500/50 rounded p-2 text-sm text-slate-200 focus:outline-none">
                    <option value="13 Inch">13 Inch</option>
                    <option value="14 Inch">14 Inch</option>
                    <option value="16 Inch">16 Inch</option>
                </select>
            </div>

            <!-- Dynamic Sub-field: Desk Settings Accessories List -->
            <div id="wrapper-desk-settings" class="hidden mb-3 bg-slate-900/60 p-3 rounded-lg border border-indigo-500/30">
                <label class="block text-xs text-indigo-400 mb-2 font-semibold">Desk Accessories & Quantities</label>
                <div class="space-y-2" id="desk-accessories-list">
                    <div class="flex items-center justify-between text-xs text-slate-200">
                        <span>Dock Screen</span>
                        <select data-acc="Dock Screen" class="acc-qty-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-200">
                        <span>Normal Screens</span>
                        <select data-acc="Normal Screens" class="acc-qty-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-200">
                        <span>Keyboard & Mouse</span>
                        <select data-acc="Keyboard & Mouse" class="acc-qty-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-200">
                        <span>Webcam</span>
                        <select data-acc="Webcam" class="acc-qty-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-200">
                        <span>Wireless Headphones</span>
                        <select data-acc="Wireless Headphones" class="acc-qty-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-200">
                        <span>Wireless Keyboard & Mouse</span>
                        <select data-acc="Wireless Keyboard & Mouse" class="acc-qty-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5+">5+</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- User Location Dropdowns -->
            <div class="bg-slate-900/40 p-3 rounded-lg border border-slate-700 mb-3">
                <label class="block text-xs text-slate-400 mb-2 font-semibold">User Location</label>
                <div class="space-y-2">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Block & Floor</label>
                        <select id="loc-block-floor" onchange="handleBlockChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="AG (A Block - Ground Floor)">AG - A Block, Ground Floor</option>
                            <option value="A1 (A Block - 1st Floor)">A1 - A Block, 1st Floor</option>
                            <option value="A2 (A Block - 2nd Floor)">A2 - A Block, 2nd Floor</option>
                            <option value="A3 (A Block - 3rd Floor)">A3 - A Block, 3rd Floor</option>
                            <option value="BG (B Block - Ground Floor)">BG - B Block, Ground Floor</option>
                            <option value="B1 (B Block - 1st Floor)">B1 - B Block, 1st Floor</option>
                            <option value="B2 (B Block - 2nd Floor)">B2 - B Block, 2nd Floor</option>
                            <option value="B3 (B Block - 3rd Floor)">B3 - B Block, 3rd Floor</option>
                            <option value="CG (C Block - Ground Floor)">CG - C Block, Ground Floor</option>
                            <option value="C1 (C Block - 1st Floor)">C1 - C Block, 1st Floor</option>
                            <option value="C2 (C Block - 2nd Floor)">C2 - C Block, 2nd Floor</option>
                            <option value="C3 (C Block - 3rd Floor)">C3 - C Block, 3rd Floor</option>
                        </select>
                    </div>

                    <!-- Block A Section -->
                    <div id="wrapper-section" class="hidden">
                        <label class="block text-[11px] text-indigo-400 mb-1 font-semibold">Block A Section</label>
                        <select id="loc-section" class="w-full bg-slate-900 border border-indigo-500/50 rounded p-1.5 text-xs text-slate-200 focus:outline-none">
                            <option value="Section 1">Section 1</option>
                            <option value="Section 2">Section 2</option>
                            <option value="Section 3">Section 3</option>
                            <option value="Section 6">Section 6</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">Room Number (0-50)</label>
                            <select id="loc-room" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">Seat Number (0-100)</label>
                            <select id="loc-seat" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Description with Bullet Points Helper -->
            <div class="flex justify-between items-center mb-1">
                <label class="text-xs text-slate-400">Description</label>
                <button type="button" onclick="addBulletPoint()" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium">+ Add Bullet</button>
            </div>
            <textarea id="t-desc" rows="4" placeholder="Enter details..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-3 focus:outline-none focus:border-indigo-500 transition-colors"></textarea>

            <!-- Status and Priority -->
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Status</label>
                    <select id="t-status" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="OPEN">OPEN</option>
                        <option value="IN PROGRESS">IN PROGRESS</option>
                        <option value="RESOLVED">RESOLVED</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Priority</label>
                    <select id="t-priority" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
            </div>

            <!-- Assignee -->
            <label class="block text-xs text-slate-400 mb-1">Assignee</label>
            <input type="text" id="t-assignee" value="Sinoj Thomas" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-5 focus:outline-none focus:border-indigo-500 transition-colors">

            <!-- Action Buttons -->
            <div class="flex justify-between items-center">
                <button id="btn-delete" onclick="deleteTicket()" class="px-3 py-2 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 text-xs font-semibold rounded hidden transition-colors">Delete</button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded text-slate-300 transition-colors">Cancel</button>
                    <button onclick="saveTicket()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-xs font-semibold rounded text-white transition-colors">Save Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function initLocationDropdowns() {
            const roomSel = document.getElementById('loc-room');
            const seatSel = document.getElementById('loc-seat');
            
            roomSel.innerHTML = '';
            for(let i=0; i<=50; i++) {
                roomSel.innerHTML += `<option value="Room ${i}">Room ${i}</option>`;
            }

            seatSel.innerHTML = '';
            for(let i=0; i<=100; i++) {
                seatSel.innerHTML += `<option value="Seat ${i}">Seat ${i}</option>`;
            }
        }
        initLocationDropdowns();

        let tickets = JSON.parse(localStorage.getItem('my_jobs_to_do_tickets')) || [
            { id: 'TK-3232', endUser: 'Alex Smith', subject: 'Software Installation', subOption: '', deskItems: [], locBlockFloor: 'AG (A Block - Ground Floor)', locSection: 'Section 1', locRoom: 'Room 5', locSeat: 'Seat 12', desc: '• Install VLC Media Player\n• Setup default video associations', status: 'OPEN', priority: 'Medium', assignee: 'Sinoj Thomas' },
            { id: 'TK-1002', endUser: 'Sarah Connor', subject: 'New Laptop', subOption: '14 Inch', deskItems: [], locBlockFloor: 'B1 (B Block - 1st Floor)', locSection: '', locRoom: 'Room 14', locSeat: 'Seat 3', desc: '• Prepare device setup\n• Verify company portal access', status: 'OPEN', priority: 'High', assignee: 'Sinoj Thomas' }
        ];

        function handleBlockChange() {
            const blockFloor = document.getElementById('loc-block-floor').value;
            const sectionWrapper = document.getElementById('wrapper-section');

            if (blockFloor.startsWith('A')) {
                sectionWrapper.classList.remove('hidden');
            } else {
                sectionWrapper.classList.add('hidden');
            }
        }

        function render() {
            localStorage.setItem('my_jobs_to_do_tickets', JSON.stringify(tickets));
            const container = document.getElementById('ticket-list');
            container.innerHTML = '';

            let openCount = 0, progressCount = 0, resolvedCount = 0;

            tickets.forEach(t => {
                if(t.status === 'OPEN') openCount++;
                if(t.status === 'IN PROGRESS') progressCount++;
                if(t.status === 'RESOLVED') resolvedCount++;

                let badgeClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if(t.status === 'IN PROGRESS') badgeClass = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                if(t.status === 'RESOLVED') badgeClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

                const formattedDesc = (t.desc || 'No description provided.')
                    .split('\n')
                    .map(line => `<div class="text-xs text-slate-300">${line}</div>`)
                    .join('');

                let subDetail = t.subOption || '';
                if(t.deskItems && t.deskItems.length > 0) {
                    subDetail = t.deskItems.map(i => `${i.name}: ${i.qty}`).join(', ');
                }

                const subTag = subDetail ? `<span class="ml-2 text-[10px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/30">${subDetail}</span>` : '';

                let locationStr = 'N/A';
                if (t.locBlockFloor) {
                    const blockCode = t.locBlockFloor.split(' ')[0];
                    const secTag = (t.locSection && blockCode.startsWith('A')) ? ` (${t.locSection})` : '';
                    locationStr = `${blockCode}${secTag}, ${t.locRoom}, ${t.locSeat}`;
                } else if (t.location) {
                    locationStr = t.location;
                }

                const endUserStr = t.endUser ? `<p class="text-[11px] text-slate-400 mb-0.5">👤 End User: <span class="text-slate-200 font-medium">${t.endUser}</span></p>` : '';

                const card = `
                    <div onclick="openEditModal('${t.id}')" class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-sm card-transition cursor-pointer hover:border-slate-600">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded border ${badgeClass}">${t.status}</span>
                            <span class="text-xs text-slate-400">#${t.id}</span>
                        </div>
                        <h3 class="font-semibold text-slate-100 mb-1 flex items-center flex-wrap">
                            ${t.subject} ${subTag}
                        </h3>
                        ${endUserStr}
                        <p class="text-[11px] text-slate-400 mb-2">📍 Location: <span class="text-slate-300">${locationStr}</span></p>
                        <div class="space-y-0.5 mb-3">${formattedDesc}</div>
                        <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-700/50">
                            <span>Assignee: <strong class="text-slate-200">${t.assignee}</strong></span>
                            <span class="${t.priority === 'High' ? 'text-rose-400' : 'text-slate-300'} font-medium">${t.priority}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });

            document.getElementById('stat-open').innerText = openCount;
            document.getElementById('stat-progress').innerText = progressCount;
            document.getElementById('stat-resolved').innerText = resolvedCount;
        }

        function handleSubjectChange() {
            const subject = document.getElementById('t-subject').value;
            const laptopWrapper = document.getElementById('wrapper-laptop-size');
            const deskWrapper = document.getElementById('wrapper-desk-settings');

            laptopWrapper.classList.add('hidden');
            deskWrapper.classList.add('hidden');

            if (subject === 'New Laptop') {
                laptopWrapper.classList.remove('hidden');
            } else if (subject === 'Desk Settings') {
                deskWrapper.classList.remove('hidden');
            }
        }

        function resetDeskAccessories() {
            document.querySelectorAll('.acc-qty-select').forEach(sel => sel.value = '0');
        }

        function addBulletPoint() {
            const desc = document.getElementById('t-desc');
            if (desc.value.length === 0) {
                desc.value = '• ';
            } else {
                desc.value += '\n• ';
            }
            desc.focus();
        }

        function openCreateModal() {
            document.getElementById('modal-title').innerText = "Create Ticket";
            document.getElementById('t-id').value = '';
            document.getElementById('t-end-user').value = '';
            document.getElementById('t-subject').value = 'Software Installation';
            
            document.getElementById('loc-block-floor').value = 'AG (A Block - Ground Floor)';
            document.getElementById('loc-section').value = 'Section 1';
            document.getElementById('loc-room').value = 'Room 0';
            document.getElementById('loc-seat').value = 'Seat 0';

            document.getElementById('t-desc').value = '• ';
            document.getElementById('t-status').value = 'OPEN';
            document.getElementById('t-priority').value = 'Medium';
            document.getElementById('t-assignee').value = 'Sinoj Thomas';
            
            resetDeskAccessories();
            handleSubjectChange();
            handleBlockChange();

            document.getElementById('btn-delete').classList.add('hidden');
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
        }

        function openEditModal(id) {
            const t = tickets.find(item => item.id === id);
            if(!t) return;

            document.getElementById('modal-title').innerText = "Edit Ticket #" + t.id;
            document.getElementById('t-id').value = t.id;
            document.getElementById('t-end-user').value = t.endUser || '';
            document.getElementById('t-subject').value = t.subject;
            
            resetDeskAccessories();
            handleSubjectChange();

            if (t.subject === 'New Laptop') {
                document.getElementById('t-laptop-size').value = t.subOption || '13 Inch';
            } else if (t.subject === 'Desk Settings' && t.deskItems) {
                t.deskItems.forEach(item => {
                    const sel = document.querySelector(`.acc-qty-select[data-acc="${item.name}"]`);
                    if(sel) sel.value = item.qty;
                });
            }

            document.getElementById('loc-block-floor').value = t.locBlockFloor || 'AG (A Block - Ground Floor)';
            document.getElementById('loc-section').value = t.locSection || 'Section 1';
            document.getElementById('loc-room').value = t.locRoom || 'Room 0';
            document.getElementById('loc-seat').value = t.locSeat || 'Seat 0';

            handleBlockChange();

            document.getElementById('t-desc').value = t.desc || '';
            document.getElementById('t-status').value = t.status;
            document.getElementById('t-priority').value = t.priority;
            document.getElementById('t-assignee').value = t.assignee || 'Sinoj Thomas';

            document.getElementById('btn-delete').classList.remove('hidden');
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 250);
        }

        function saveTicket() {
            const id = document.getElementById('t-id').value;
            const endUser = document.getElementById('t-end-user').value.trim();
            const subject = document.getElementById('t-subject').value;
            
            const locBlockFloor = document.getElementById('loc-block-floor').value;
            const locSection = locBlockFloor.startsWith('A') ? document.getElementById('loc-section').value : '';
            const locRoom = document.getElementById('loc-room').value;
            const locSeat = document.getElementById('loc-seat').value;

            const desc = document.getElementById('t-desc').value.trim();
            const status = document.getElementById('t-status').value;
            const priority = document.getElementById('t-priority').value;
            const assignee = document.getElementById('t-assignee').value.trim() || 'Sinoj Thomas';

            let subOption = '';
            let deskItems = [];

            if (subject === 'New Laptop') {
                subOption = document.getElementById('t-laptop-size').value;
            } else if (subject === 'Desk Settings') {
                document.querySelectorAll('.acc-qty-select').forEach(sel => {
                    const val = sel.value;
                    if (val !== '0') {
                        deskItems.push({
                            name: sel.getAttribute('data-acc'),
                            qty: val
                        });
                    }
                });

                if (deskItems.length === 0) {
                    alert('Please select at least one accessory with a quantity greater than 0.');
                    return;
                }
            }

            if(id) {
                const index = tickets.findIndex(t => t.id === id);
                if(index !== -1) {
                    tickets[index] = { id, endUser, subject, subOption, deskItems, locBlockFloor, locSection, locRoom, locSeat, desc, status, priority, assignee };
                }
            } else {
                const newId = 'TK-' + Math.floor(1000 + Math.random() * 9000);
                tickets.unshift({ id: newId, endUser, subject, subOption, deskItems, locBlockFloor, locSection, locRoom, locSeat, desc, status, priority, assignee });
            }

            closeModal();
            render();
        }

        function deleteTicket() {
            const id = document.getElementById('t-id').value;
            if(confirm("Are you sure you want to delete this ticket?")) {
                tickets = tickets.filter(t => t.id !== id);
                closeModal();
                render();
            }
        }

        function exportToExcel() {
            if (tickets.length === 0) {
                alert('No tickets available to export.');
                return;
            }

            const headers = ["Ticket ID", "End User", "Subject", "Sub Details", "Location", "Description", "Status", "Priority", "Assignee"];
            
            const rows = tickets.map(t => {
                let subDetail = t.subOption || '';
                if(t.deskItems && t.deskItems.length > 0) {
                    subDetail = t.deskItems.map(i => `${i.name}: ${i.qty}`).join('; ');
                }

                let locationStr = 'N/A';
                if (t.locBlockFloor) {
                    const blockCode = t.locBlockFloor.split(' ')[0];
                    const secTag = (t.locSection && blockCode.startsWith('A')) ? ` (${t.locSection})` : '';
                    locationStr = `${blockCode}${secTag}, ${t.locRoom}, ${t.locSeat}`;
                } else if (t.location) {
                    locationStr = t.location;
                }

                const cleanDesc = (t.desc || '').replace(/\r?\n|\r/g, ' ');

                return [
                    `"${t.id}"`,
                    `"${(t.endUser || '').replace(/"/g, '""')}"`,
                    `"${(t.subject || '').replace(/"/g, '""')}"`,
                    `"${subDetail.replace(/"/g, '""')}"`,
                    `"${locationStr.replace(/"/g, '""')}"`,
                    `"${cleanDesc.replace(/"/g, '""')}"`,
                    `"${t.status}"`,
                    `"${t.priority}"`,
                    `"${(t.assignee || '').replace(/"/g, '""')}"`
                ];
            });

            const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `IT_Tickets_Export_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        render();
    </script>
</body>
</html>
