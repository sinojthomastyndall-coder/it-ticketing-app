<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>My Jobs To Do</title>

    <!-- Firebase SDKs -->

    <!-- Chart.js for Pie Chart -->

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Stylish Slow Modal Popup Transitions */
.modal-backdrop {
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-card {
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transform: scale(0.85) translateY(30px);
    opacity: 0;
}
.modal-open .modal-card {
    transform: scale(1) translateY(0);
    opacity: 1;
}

        .card-transition { transition: all 0.2s ease-in-out; }
        .card-transition:active { transform: scale(0.98); }
        .tab-btn { transition: all 0.2s ease; cursor: pointer; }
        .tab-btn.active-all { border-color: #6366f1; background-color: rgba(99, 102, 241, 0.15); }
        .tab-btn.active-open { border-color: #f59e0b; background-color: rgba(245, 158, 11, 0.15); }
        .tab-btn.active-waiting { border-color: #a855f7; background-color: rgba(168, 85, 247, 0.15); }
        .tab-btn.active-progress { border-color: #3b82f6; background-color: rgba(59, 130, 246, 0.15); }
        .tab-btn.active-resolved { border-color: #10b981; background-color: rgba(16, 185, 129, 0.15); }
        .tab-btn.active-today { border-color: #06b6d4; background-color: rgba(6, 182, 212, 0.15); }
    </style>
</head>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA4kt0CDsJwicfuI-FAvNDae4ZO0KfCYTI",
            authDomain: "it-ticketing-app-72f0e.firebaseapp.com",
            databaseURL: "https://it-ticketing-app-72f0e-default-rtdb.firebaseio.com",
            projectId: "it-ticketing-app-72f0e",
            storageBucket: "it-ticketing-app-72f0e.firebasestorage.app",
            messagingSenderId: "105148297755",
            appId: "1:105148297755:web:29ab94c29a3fa7555abebe"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ticketsRef = db.ref('tickets');

        let tickets = [];
        let currentTab = 'ALL';
        let uniqueUserNames = [];
        let statusChart = null;

        function getTodayFormatted() {
            var d = new Date();
            var year = d.getFullYear();
            var month = ('0' + (d.getMonth() + 1)).slice(-2);
            var day = ('0' + d.getDate()).slice(-2);
            return year + '-' + month + '-' + day;
        }

        function initPieChart() {
            const ctx = document.getElementById('statusPieChart').getContext('2d');
            statusChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Open', 'Waiting Info', 'In Progress', 'Resolved'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: ['#f59e0b', '#a855f7', '#3b82f6', '#10b981'],
                        borderColor: '#0f172a',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#cbd5e1', font: { size: 11 } }
                        }
                    }
                }
            });
        }

        function updateEndUserDatalist() {
            uniqueUserNames = [];
            tickets.forEach(function(t) {
                if (t.endUser && t.endUser.trim() !== '') {
                    var trimmed = t.endUser.trim();
                    if (uniqueUserNames.indexOf(trimmed) === -1) {
                        uniqueUserNames.push(trimmed);
                    }
                }
            });
            uniqueUserNames.sort();
        }

        function showCustomSuggestions() {
            filterCustomSuggestions();
        }

        function filterCustomSuggestions() {
            var box = document.getElementById('custom-suggestions-box');
            var val = document.getElementById('t-end-user').value.toLowerCase().trim();
            box.innerHTML = '';

            if (val.length === 0) {
                box.classList.add('hidden');
                return;
            }

            var matches = uniqueUserNames.filter(function(name) {
                return name.toLowerCase().includes(val);
            });

            if (matches.length === 0) {
                box.classList.add('hidden');
                return;
            }

            matches.forEach(function(name) {
                var item = document.createElement('div');
                item.className = 'px-3 py-2 text-xs text-slate-200 hover:bg-indigo-600/40 cursor-pointer transition-colors';
                item.innerText = name;
                item.onclick = function() {
                    document.getElementById('t-end-user').value = name;
                    box.classList.add('hidden');
                };
                box.appendChild(item);
            });

            box.classList.remove('hidden');
        }

        document.addEventListener('click', function(e) {
            var box = document.getElementById('custom-suggestions-box');
            var input = document.getElementById('t-end-user');
            if (box && !box.contains(e.target) && e.target !== input) {
                box.classList.add('hidden');
            }
        });

        function setTab(tab) {
            currentTab = tab;

            document.getElementById('tab-all').className = 'tab-btn bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-sm';
            document.getElementById('tab-open').className = 'tab-btn bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-sm';
            document.getElementById('tab-waiting').className = 'tab-btn bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-sm';
            document.getElementById('tab-progress').className = 'tab-btn bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-sm';
            document.getElementById('tab-resolved').className = 'tab-btn bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-sm';
            document.getElementById('tab-today').className = 'tab-btn bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-sm';

            if (tab === 'ALL') document.getElementById('tab-all').classList.add('active-all');
            if (tab === 'OPEN') document.getElementById('tab-open').classList.add('active-open');
            if (tab === 'WAITING FOR EMAIL RESPONSE/LICENSE INFORMATION') document.getElementById('tab-waiting').classList.add('active-waiting');
            if (tab === 'IN PROGRESS') document.getElementById('tab-progress').classList.add('active-progress');
            if (tab === 'RESOLVED') document.getElementById('tab-resolved').classList.add('active-resolved');
            if (tab === 'TODAY_RESOLVED') document.getElementById('tab-today').classList.add('active-today');

            render();
        }

        function updateRoomDropdown(maxRooms, selectedValue) {
            var roomSel = document.getElementById('loc-room');
            var currentVal = selectedValue || roomSel.value || 'Room 0';
            roomSel.innerHTML = '';
            for (var i = 0; i <= maxRooms; i++) {
                var valStr = 'Room ' + i;
                var isSelected = (valStr === currentVal) ? ' selected' : '';
                roomSel.innerHTML += '<option value="' + valStr + '"' + isSelected + '>' + valStr + '</option>';
            }
            document.getElementById('lbl-room-range').innerText = 'Room Number (0-' + maxRooms + ')';
        }

        function initLocationDropdowns() {
            var seatSel = document.getElementById('loc-seat');
            seatSel.innerHTML = '';
            for (var j = 0; j <= 100; j++) {
                seatSel.innerHTML += '<option value="Seat ' + j + '">Seat ' + j + '</option>';
            }
            updateRoomDropdown(50);
        }
        initLocationDropdowns();
        initPieChart();

        // Realtime Listener for Firebase
        ticketsRef.on('value', function(snapshot) {
            const data = snapshot.val();
            tickets = [];
            if (data) {
                Object.keys(data).forEach(function(key) {
                    tickets.push({ id: key, ...data[key] });
                });
            }
            
            tickets.sort(function(a, b) {
                var timeA = a.createdAt || 0;
                var timeB = b.createdAt || 0;
                return timeB - timeA;
            });

            render();
            updateEndUserDatalist();
        });

        function handleBlockChange() {
            var blockFloor = document.getElementById('loc-block-floor').value;
            var sectionWrapper = document.getElementById('wrapper-section');

            if (blockFloor.indexOf('A') === 0) {
                sectionWrapper.classList.remove('hidden');
            } else {
                sectionWrapper.classList.add('hidden');
            }

            var maxRooms = (blockFloor.indexOf('B1') === 0) ? 70 : 50;
            updateRoomDropdown(maxRooms);
        }

        function clearSearch() {
            document.getElementById('search-user').value = '';
            render();
        }

        function render() {
            var container = document.getElementById('ticket-list');
            container.innerHTML = '';

            var searchQuery = document.getElementById('search-user').value.toLowerCase().trim();
            var clearBtn = document.getElementById('btn-clear-search');
            
            if (searchQuery) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            var openCount = 0, waitingCount = 0, progressCount = 0, resolvedCount = 0, todayResolvedCount = 0;
            var todayStr = getTodayFormatted();

            tickets.forEach(function(t) {
                if (t.status === 'OPEN') openCount++;
                if (t.status === 'WAITING FOR EMAIL RESPONSE/LICENSE INFORMATION') waitingCount++;
                if (t.status === 'IN PROGRESS') progressCount++;
                if (t.status === 'RESOLVED') {
                    resolvedCount++;
                    if (t.resolvedDate === todayStr) {
                        todayResolvedCount++;
                    }
                }
            });

            document.getElementById('stat-all').innerText = tickets.length;
            document.getElementById('stat-open').innerText = openCount;
            document.getElementById('stat-waiting').innerText = waitingCount;
            document.getElementById('stat-progress').innerText = progressCount;
            document.getElementById('stat-resolved').innerText = resolvedCount;
            document.getElementById('stat-today').innerText = todayResolvedCount;

            if (statusChart) {
                statusChart.data.datasets[0].data = [openCount, waitingCount, progressCount, resolvedCount];
                statusChart.update();
            }

            var filteredTickets = tickets.filter(function(t) {
                var tabMatch = false;
                if (currentTab === 'ALL') tabMatch = true;
                else if (currentTab === 'TODAY_RESOLVED') tabMatch = (t.status === 'RESOLVED' && t.resolvedDate === todayStr);
                else tabMatch = (t.status === currentTab);

                if (!searchQuery) return tabMatch;
                var endUserMatch = (t.endUser || '').toLowerCase().includes(searchQuery);
                var assetMatch = (t.assetNo || '').toLowerCase().includes(searchQuery);
                return tabMatch && (endUserMatch || assetMatch);
            });

            if (filteredTickets.length === 0) {
                var tabName = currentTab === 'ALL' ? '' : (currentTab === 'TODAY_RESOLVED' ? "today's resolved " : currentTab.toLowerCase() + ' ');
                var msg = searchQuery 
                    ? 'No ' + tabName + 'tickets found matching "' + searchQuery + '".' 
                    : 'No ' + tabName + 'tickets found.';
                container.innerHTML = '<div class="text-center text-slate-500 text-xs py-8">' + msg + '</div>';
                return;
            }

            filteredTickets.forEach(function(t) {
                var badgeClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (t.status === 'WAITING FOR EMAIL RESPONSE/LICENSE INFORMATION') badgeClass = 'bg-purple-500/20 text-purple-300 border-purple-500/30';
                if (t.status === 'IN PROGRESS') badgeClass = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                if (t.status === 'RESOLVED') badgeClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

                var formattedDesc = (t.desc || 'No description provided.')
                    .split('\n')
                    .map(function(line) { return '<div class="text-xs text-slate-300">' + line + '</div>'; })
                    .join('');

                var subDetail = t.subOption || '';
                if (t.deskItems && t.deskItems.length > 0) {
                    subDetail = t.deskItems.map(function(i) { return i.name + ': ' + i.qty; }).join(', ');
                }

                var subTag = subDetail ? '<span class="ml-2 text-[10px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/30">' + subDetail + '</span>' : '';

                var locationStr = 'N/A';
                if (t.locBlockFloor) {
                    var blockCode = t.locBlockFloor.split(' ')[0];
                    var secTag = (t.locSection && blockCode.indexOf('A') === 0) ? ' (' + t.locSection + ')' : '';
                    locationStr = blockCode + secTag + ', ' + t.locRoom + ', ' + t.locSeat;
                } else if (t.location) {
                    locationStr = t.location;
                }

                var assetTag = t.assetNo ? ' <span class="text-indigo-400 text-[11px] font-normal ml-2">(Asset: ' + t.assetNo + ')</span>' : '';
                var endUserStr = t.endUser ? '<p class="text-[11px] text-slate-400 mb-0.5">👤 End User: <span class="text-slate-200 font-medium">' + t.endUser + '</span>' + assetTag + '</p>' : (t.assetNo ? '<p class="text-[11px] text-slate-400 mb-0.5">🏷 Asset No: <span class="text-indigo-300 font-medium">' + t.assetNo + '</span></p>' : '');

                var priorityClass = t.priority === 'High' ? 'text-rose-400' : 'text-slate-300';
                var resDateTag = (t.status === 'RESOLVED' && t.resolvedDate) ? '<span class="text-[10px] text-cyan-400 font-mono">Resolved: ' + t.resolvedDate + '</span>' : '';

                var card = '<div onclick="openEditModal(\'' + t.id + '\')" class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm card-transition cursor-pointer hover:border-indigo-500/50 hover:shadow-indigo-500/10 hover:shadow-lg">' +
                    '<div class="flex justify-between items-start mb-2 gap-2">' +
                        '<div class="flex items-center gap-2">' +
                            '<span class="text-[10px] font-semibold px-2 py-0.5 rounded border leading-tight text-left ' + badgeClass + '">' + t.status + '</span>' +
                            resDateTag +
                        '</div>' +
                        '<span class="text-xs text-slate-400 shrink-0">#' + t.id + '</span>' +
                    '</div>' +
                    '<h3 class="font-semibold text-slate-100 mb-1 flex items-center flex-wrap">' +
                        t.subject + ' ' + subTag +
                    '</h3>' +
                    endUserStr +
                    '<p class="text-[11px] text-slate-400 mb-2">📍 Location: <span class="text-slate-300">' + locationStr + '</span></p>' +
                    '<div class="space-y-0.5 mb-3">' + formattedDesc + '</div>' +
                    '<div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-700/50">' +
                        '<span>Assignee: <strong class="text-slate-200">' + (t.assignee || 'Sinoj Thomas') + '</strong></span>' +
                        '<span class="' + priorityClass + ' font-medium">' + t.priority + '</span>' +
                    '</div>' +
                '</div>';

                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function handleSubjectChange() {
            var subject = document.getElementById('t-subject').value;
            var laptopWrapper = document.getElementById('wrapper-laptop-size');
            var deskWrapper = document.getElementById('wrapper-desk-settings');

            laptopWrapper.classList.add('hidden');
            deskWrapper.classList.add('hidden');

            if (subject === 'New Laptop') {
                laptopWrapper.classList.remove('hidden');
            } else if (subject === 'Desk Settings') {
                deskWrapper.classList.remove('hidden');
            }
        }

        function resetDeskAccessories() {
            document.querySelectorAll('.acc-qty-select').forEach(function(sel) { sel.value = '0'; });
        }

        function addBulletPoint() {
            var desc = document.getElementById('t-desc');
            if (desc.value.length === 0) {
                desc.value = '• ';
            } else {
                desc.value += '\n• ';
            }
            desc.focus();
        }

        function showModal() {
            var modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            setTimeout(function() {
                modal.classList.remove('opacity-0');
                modal.classList.add('modal-open');
            }, 20);
        }

        function closeModal() {
    var modal = document.getElementById('modal');
    modal.classList.remove('modal-open');
    modal.classList.add('opacity-0');
    
    // Wait 580ms for the smooth fade/scale transition to finish before hiding
    setTimeout(function() { 
        modal.classList.add('hidden'); 
    }, 580);
}
        function openCreateModal() {
            updateEndUserDatalist();
            document.getElementById('custom-suggestions-box').classList.add('hidden');

            document.getElementById('modal-title').innerText = "Create Ticket";
            document.getElementById('t-id').value = '';
            document.getElementById('t-end-user').value = '';
            document.getElementById('t-asset-no').value = '';
            document.getElementById('t-subject').value = 'Software Installation';
            
            document.getElementById('loc-block-floor').value = 'AG (A Block - Ground Floor)';
            document.getElementById('loc-section').value = 'Section 1';
            
            handleBlockChange();
            document.getElementById('loc-room').value = 'Room 0';
            document.getElementById('loc-seat').value = 'Seat 0';

            document.getElementById('t-desc').value = '• ';
            document.getElementById('t-status').value = 'OPEN';
            document.getElementById('t-priority').value = 'Medium';
            document.getElementById('t-assignee').value = 'Sinoj Thomas';
            
            resetDeskAccessories();
            handleSubjectChange();

            document.getElementById('btn-delete').classList.add('hidden');
            showModal();
        }

        function openEditModal(id) {
            updateEndUserDatalist();
            document.getElementById('custom-suggestions-box').classList.add('hidden');

            var t = tickets.find(function(item) { return item.id === id; });
            if (!t) return;

            document.getElementById('modal-title').innerText = "Edit Ticket #" + t.id;
            document.getElementById('t-id').value = t.id;
            document.getElementById('t-end-user').value = t.endUser || '';
            document.getElementById('t-asset-no').value = t.assetNo || '';
            document.getElementById('t-subject').value = t.subject;
            
            resetDeskAccessories();
            handleSubjectChange();

            if (t.subject === 'New Laptop') {
                document.getElementById('t-laptop-size').value = t.subOption || '13 Inch';
            } else if (t.subject === 'Desk Settings' && t.deskItems) {
                t.deskItems.forEach(function(item) {
                    var sel = document.querySelector('.acc-qty-select[data-acc="' + item.name + '"]');
                    if (sel) sel.value = item.qty;
                });
            }

            document.getElementById('loc-block-floor').value = t.locBlockFloor || 'AG (A Block - Ground Floor)';
            document.getElementById('loc-section').value = t.locSection || 'Section 1';
            
            handleBlockChange();
            updateRoomDropdown((t.locBlockFloor && t.locBlockFloor.indexOf('B1') === 0) ? 70 : 50, t.locRoom || 'Room 0');
            document.getElementById('loc-seat').value = t.locSeat || 'Seat 0';

            document.getElementById('t-desc').value = t.desc || '';
            document.getElementById('t-status').value = t.status;
            document.getElementById('t-priority').value = t.priority;
            document.getElementById('t-assignee').value = t.assignee || 'Sinoj Thomas';

            document.getElementById('btn-delete').classList.remove('hidden');
            showModal();
        }

        function saveTicket() {
            var id = document.getElementById('t-id').value;
            var endUser = document.getElementById('t-end-user').value.trim();
            var assetNo = document.getElementById('t-asset-no').value.trim();
            var subject = document.getElementById('t-subject').value;
            
            var locBlockFloor = document.getElementById('loc-block-floor').value;
            var locSection = locBlockFloor.indexOf('A') === 0 ? document.getElementById('loc-section').value : '';
            var locRoom = document.getElementById('loc-room').value;
            var locSeat = document.getElementById('loc-seat').value;

            var desc = document.getElementById('t-desc').value.trim();
            var status = document.getElementById('t-status').value;
            var priority = document.getElementById('t-priority').value;
            var assignee = document.getElementById('t-assignee').value.trim() || 'Sinoj Thomas';

            var subOption = '';
            var deskItems = [];

            if (subject === 'New Laptop') {
                subOption = document.getElementById('t-laptop-size').value;
            } else if (subject === 'Desk Settings') {
                document.querySelectorAll('.acc-qty-select').forEach(function(sel) {
                    var val = sel.value;
                    if (val !== '0') {
                        deskItems.push({
                            name: sel.getAttribute('data-acc'),
                            qty: val
                        });
                    }
                });

                if (deskItems.length === 0) {
                    alert('Please select at least one accessory with a quantity greater than 0.');
                    return;
                }
            }

            var existingTicket = id ? tickets.find(function(t) { return t.id === id; }) : null;
            var resolvedDate = existingTicket ? (existingTicket.resolvedDate || null) : null;

            if (status === 'RESOLVED') {
                if (!existingTicket || existingTicket.status !== 'RESOLVED' || !existingTicket.resolvedDate) {
                    resolvedDate = getTodayFormatted();
                }
            } else {
                resolvedDate = null;
            }

            var ticketData = {
                endUser: endUser,
                assetNo: assetNo,
                subject: subject,
                subOption: subOption,
                deskItems: deskItems,
                locBlockFloor: locBlockFloor,
                locSection: locSection,
                locRoom: locRoom,
                locSeat: locSeat,
                desc: desc,
                status: status,
                priority: priority,
                assignee: assignee,
                createdAt: existingTicket ? (existingTicket.createdAt || Date.now()) : Date.now(),
                resolvedDate: resolvedDate
            };

            if (id) {
                db.ref('tickets/' + id).update(ticketData);
            } else {
                var newKey = 'TK-' + Math.floor(1000 + Math.random() * 9000);
                db.ref('tickets/' + newKey).set(ticketData);
            }

            closeModal();
        }

        function deleteTicket() {
            var id = document.getElementById('t-id').value;
            if (confirm("Are you sure you want to delete this ticket?")) {
                db.ref('tickets/' + id).remove();
                closeModal();
            }
        }

        async function exportToExcel() {
            if (tickets.length === 0) {
                alert('No tickets available to export.');
                return;
            }

            var headers = ["Ticket ID", "End User", "Asset Number", "Subject", "Sub Details", "Location", "Description", "Status", "Priority", "Assignee", "Resolved Date"];
            
            var rows = tickets.map(function(t) {
                var subDetail = t.subOption || '';
                if (t.deskItems && t.deskItems.length > 0) {
                    subDetail = t.deskItems.map(function(i) { return i.name + ': ' + i.qty; }).join('; ');
                }

                var locationStr = 'N/A';
                if (t.locBlockFloor) {
                    var blockCode = t.locBlockFloor.split(' ')[0];
                    var secTag = (t.locSection && blockCode.indexOf('A') === 0) ? ' (' + t.locSection + ')' : '';
                    locationStr = blockCode + secTag + ', ' + t.locRoom + ', ' + t.locSeat;
                } else if (t.location) {
                    locationStr = t.location;
                }

                var cleanDesc = (t.desc || '').replace(/\r?\n|\r/g, ' ');

                return [
                    '"' + t.id + '"',
                    '"' + (t.endUser || '').replace(/"/g, '""') + '"',
                    '"' + (t.assetNo || '').replace(/"/g, '""') + '"',
                    '"' + (t.subject || '').replace(/"/g, '""') + '"',
                    '"' + subDetail.replace(/"/g, '""') + '"',
                    '"' + locationStr.replace(/"/g, '""') + '"',
                    '"' + cleanDesc.replace(/"/g, '""') + '"',
                    '"' + t.status + '"',
                    '"' + t.priority + '"',
                    '"' + (t.assignee || 'Sinoj Thomas').replace(/"/g, '""') + '"',
                    '"' + (t.resolvedDate || '') + '"'
                ];
            });

            var csvContent = "\uFEFF" + [headers.join(','), ...rows.map(function(e) { return e.join(','); })].join('\n');
            var fileName = "IT_Tickets_Export_" + new Date().toISOString().slice(0,10) + ".csv";
            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

            if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'text/csv' })] })) {
                try {
                    var file = new File([blob], fileName, { type: 'text/csv' });
                    await navigator.share({
                        files: [file],
                        title: 'IT Tickets Export',
                        text: 'Exported IT Tickets List'
                    });
                    return;
                } catch (err) {
                    console.log('Share canceled:', err);
                }
            }

            var url = URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
