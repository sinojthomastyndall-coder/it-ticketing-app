<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Jobs To Do</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .modal-animate { transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out; }
        .card-transition { transition: all 0.2s ease-in-out; }
        .card-transition:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 min-h-screen pb-12">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-indigo-400">My Jobs To Do</h1>
            <p class="text-xs text-slate-400">IT Support Dashboard</p>
        </div>
        <button onclick="openCreateModal()" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition-all duration-200">
            + New Ticket
        </button>
    </div>

    <!-- Stats Overview -->
    <div class="grid grid-cols-3 gap-3 mb-6 text-center">
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-sm">
            <span class="block text-2xl font-bold text-amber-400" id="stat-open">0</span>
            <span class="text-xs text-slate-400">Open</span>
        </div>
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-sm">
            <span class="block text-2xl font-bold text-blue-400" id="stat-progress">0</span>
            <span class="text-xs text-slate-400">In Progress</span>
        </div>
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 shadow-sm">
            <span class="block text-2xl font-bold text-emerald-400" id="stat-resolved">0</span>
            <span class="text-xs text-slate-400">Resolved</span>
        </div>
    </div>

    <!-- Ticket List -->
    <div id="ticket-list" class="space-y-3"></div>

    <!-- Create/Edit Ticket Modal -->
    <div id="modal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 hidden z-50 opacity-0 modal-animate">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold text-slate-100 mb-4" id="modal-title">Create Ticket</h2>
            
            <input type="hidden" id="t-id">

            <!-- Subject Dropdown -->
            <label class="block text-xs text-slate-400 mb-1">Subject</label>
            <select id="t-subject" onchange="handleSubjectChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-3 focus:outline-none focus:border-indigo-500 transition-colors">
                <option value="Software Installation">Software Installation</option>
                <option value="Faulty Hardware">Faulty Hardware</option>
                <option value="Login Error">Login Error</option>
                <option value="PC Intune">PC Intune</option>
                <option value="Laptop Intune">Laptop Intune</option>
                <option value="New Laptop">New Laptop</option>
                <option value="Desk Settings">Desk Settings</option>
                <option value="Others">Others</option>
            </select>

            <!-- Dynamic Sub-field: Laptop Size (Appears when New Laptop is selected) -->
            <div id="wrapper-laptop-size" class="hidden mb-3">
                <label class="block text-xs text-indigo-400 mb-1 font-semibold">Laptop Size</label>
                <select id="t-laptop-size" class="w-full bg-slate-900 border border-indigo-500/50 rounded p-2 text-sm text-slate-200 focus:outline-none">
                    <option value="13 Inch">13 Inch</option>
                    <option value="14 Inch">14 Inch</option>
                    <option value="16 Inch">16 Inch</option>
                </select>
            </div>

            <!-- Dynamic Sub-field: Desk Settings Accessories -->
            <div id="wrapper-desk-settings" class="hidden mb-3">
                <label class="block text-xs text-indigo-400 mb-1 font-semibold">Desk Accessories</label>
                <select id="t-desk-settings" onchange="handleDeskSettingsChange()" class="w-full bg-slate-900 border border-indigo-500/50 rounded p-2 text-sm text-slate-200 focus:outline-none">
                    <option value="How many Dock Screens">How many Dock Screens</option>
                    <option value="How many Normal Screens">How many Normal Screens</option>
                    <option value="Keyboard & Mouse">Keyboard & Mouse</option>
                    <option value="Webcam">Webcam</option>
                    <option value="Wireless Headphones">Wireless Headphones</option>
                    <option value="Wireless Keyboard & Mouse">Wireless Keyboard & Mouse</option>
                </select>
            </div>

            <!-- Dynamic Sub-field: Desk Quantity -->
            <div id="wrapper-desk-qty" class="hidden mb-3">
                <label class="block text-xs text-indigo-400 mb-1 font-semibold" id="lbl-desk-qty">Select Quantity (Mandatory)</label>
                <select id="t-desk-qty" class="w-full bg-slate-900 border border-indigo-500/50 rounded p-2 text-sm text-slate-200 focus:outline-none">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5+">5+</option>
                </select>
            </div>

            <!-- User Location -->
            <label class="block text-xs text-slate-400 mb-1">User Location</label>
            <input type="text" id="t-location" placeholder="e.g. Building A - Room 204" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-3 focus:outline-none focus:border-indigo-500 transition-colors">

            <!-- Description with Bullet Points Helper -->
            <div class="flex justify-between items-center mb-1">
                <label class="text-xs text-slate-400">Description</label>
                <button type="button" onclick="addBulletPoint()" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium">+ Add Bullet</button>
            </div>
            <textarea id="t-desc" rows="4" placeholder="Enter details..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-3 focus:outline-none focus:border-indigo-500 transition-colors"></textarea>

            <!-- Status and Priority -->
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Status</label>
                    <select id="t-status" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="OPEN">OPEN</option>
                        <option value="IN PROGRESS">IN PROGRESS</option>
                        <option value="RESOLVED">RESOLVED</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Priority</label>
                    <select id="t-priority" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
            </div>

            <!-- Assignee -->
            <label class="block text-xs text-slate-400 mb-1">Assignee</label>
            <input type="text" id="t-assignee" value="Sinoj Thomas" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 mb-5 focus:outline-none focus:border-indigo-500 transition-colors">

            <!-- Action Buttons -->
            <div class="flex justify-between items-center">
                <button id="btn-delete" onclick="deleteTicket()" class="px-3 py-2 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 text-xs font-semibold rounded hidden transition-colors">Delete</button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded text-slate-300 transition-colors">Cancel</button>
                    <button onclick="saveTicket()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-xs font-semibold rounded text-white transition-colors">Save Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tickets = JSON.parse(localStorage.getItem('my_jobs_to_do_tickets')) || [
            { id: 'TK-3232', subject: 'Software Installation', subOption: '', qtyOption: '', location: 'Main Office', desc: '• Install VLC Media Player\n• Setup default video associations', status: 'OPEN', priority: 'Medium', assignee: 'Sinoj Thomas' },
            { id: 'TK-1002', subject: 'New Laptop', subOption: '14 Inch', qtyOption: '', location: 'Lab 2B', desc: '• Prepare device setup\n• Verify company portal access', status: 'OPEN', priority: 'High', assignee: 'Sinoj Thomas' }
        ];

        function render() {
            localStorage.setItem('my_jobs_to_do_tickets', JSON.stringify(tickets));
            const container = document.getElementById('ticket-list');
            container.innerHTML = '';

            let openCount = 0, progressCount = 0, resolvedCount = 0;

            tickets.forEach(t => {
                if(t.status === 'OPEN') openCount++;
                if(t.status === 'IN PROGRESS') progressCount++;
                if(t.status === 'RESOLVED') resolvedCount++;

                let badgeClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if(t.status === 'IN PROGRESS') badgeClass = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                if(t.status === 'RESOLVED') badgeClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

                const formattedDesc = (t.desc || 'No description provided.')
                    .split('\n')
                    .map(line => `<div class="text-xs text-slate-300">${line}</div>`)
                    .join('');

                let subDetail = t.subOption || '';
                if(t.qtyOption) {
                    subDetail += subDetail ? ` (Qty: ${t.qtyOption})` : `Qty: ${t.qtyOption}`;
                }

                const subTag = subDetail ? `<span class="ml-2 text-[10px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/30">${subDetail}</span>` : '';

                const card = `
                    <div onclick="openEditModal('${t.id}')" class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-sm card-transition cursor-pointer hover:border-slate-600">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded border ${badgeClass}">${t.status}</span>
                            <span class="text-xs text-slate-400">#${t.id}</span>
                        </div>
                        <h3 class="font-semibold text-slate-100 mb-1 flex items-center flex-wrap">
                            ${t.subject} ${subTag}
                        </h3>
                        ${t.location ? `<p class="text-[11px] text-slate-400 mb-2">📍 Location: <span class="text-slate-300">${t.location}</span></p>` : ''}
                        <div class="space-y-0.5 mb-3">${formattedDesc}</div>
                        <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-700/50">
                            <span>Assignee: <strong class="text-slate-200">${t.assignee}</strong></span>
                            <span class="${t.priority === 'High' ? 'text-rose-400' : 'text-slate-300'} font-medium">${t.priority}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });

            document.getElementById('stat-open').innerText = openCount;
            document.getElementById('stat-progress').innerText = progressCount;
            document.getElementById('stat-resolved').innerText = resolvedCount;
        }

        function handleSubjectChange() {
            const subject = document.getElementById('t-subject').value;
            const laptopWrapper = document.getElementById('wrapper-laptop-size');
            const deskWrapper = document.getElementById('wrapper-desk-settings');
            const qtyWrapper = document.getElementById('wrapper-desk-qty');

            laptopWrapper.classList.add('hidden');
            deskWrapper.classList.add('hidden');
            qtyWrapper.classList.add('hidden');

            if (subject === 'New Laptop') {
                laptopWrapper.classList.remove('hidden');
            } else if (subject === 'Desk Settings') {
                deskWrapper.classList.remove('hidden');
                handleDeskSettingsChange();
            }
        }

        function handleDeskSettingsChange() {
            const qtyWrapper = document.getElementById('wrapper-desk-qty');
            qtyWrapper.classList.remove('hidden');
            document.getElementById('t-desk-qty').value = '0';
        }

        function addBulletPoint() {
            const desc = document.getElementById('t-desc');
            if (desc.value.length === 0) {
                desc.value = '• ';
            } else {
                desc.value += '\n• ';
            }
            desc.focus();
        }

        function openCreateModal() {
            document.getElementById('modal-title').innerText = "Create Ticket";
            document.getElementById('t-id').value = '';
            document.getElementById('t-subject').value = 'Software Installation';
            document.getElementById('t-location').value = '';
            document.getElementById('t-desc').value = '• ';
            document.getElementById('t-status').value = 'OPEN';
            document.getElementById('t-priority').value = 'Medium';
            document.getElementById('t-assignee').value = 'Sinoj Thomas';
            
            handleSubjectChange();

            document.getElementById('btn-delete').classList.add('hidden');
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
        }

        function openEditModal(id) {
            const t = tickets.find(item => item.id === id);
            if(!t) return;

            document.getElementById('modal-title').innerText = "Edit Ticket #" + t.id;
            document.getElementById('t-id').value = t.id;
            document.getElementById('t-subject').value = t.subject;
            
            handleSubjectChange();

            if (t.subject === 'New Laptop') {
                document.getElementById('t-laptop-size').value = t.subOption || '13 Inch';
            } else if (t.subject === 'Desk Settings') {
                document.getElementById('t-desk-settings').value = t.subOption || 'How many Dock Screens';
                handleDeskSettingsChange();
                document.getElementById('t-desk-qty').value = t.qtyOption || '0';
            }

            document.getElementById('t-location').value = t.location || '';
            document.getElementById('t-desc').value = t.desc || '';
            document.getElementById('t-status').value = t.status;
            document.getElementById('t-priority').value = t.priority;
            document.getElementById('t-assignee').value = t.assignee || 'Sinoj Thomas';

            document.getElementById('btn-delete').classList.remove('hidden');
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 250);
        }

        function saveTicket() {
            const id = document.getElementById('t-id').value;
            const subject = document.getElementById('t-subject').value;
            const location = document.getElementById('t-location').value.trim();
            const desc = document.getElementById('t-desc').value.trim();
            const status = document.getElementById('t-status').value;
            const priority = document.getElementById('t-priority').value;
            const assignee = document.getElementById('t-assignee').value.trim() || 'Sinoj Thomas';

            let subOption = '';
            let qtyOption = '';

            if (subject === 'New Laptop') {
                subOption = document.getElementById('t-laptop-size').value;
            } else if (subject === 'Desk Settings') {
                subOption = document.getElementById('t-desk-settings').value;
                qtyOption = document.getElementById('t-desk-qty').value;

                if (qtyOption === '0') {
                    alert('Please select a valid quantity (> 0) for desk accessories.');
                    return;
                }
            }

            if(id) {
                const index = tickets.findIndex(t => t.id === id);
                if(index !== -1) {
                    tickets[index] = { id, subject, subOption, qtyOption, location, desc, status, priority, assignee };
                }
            } else {
                const newId = 'TK-' + Math.floor(1000 + Math.random() * 9000);
                tickets.unshift({ id: newId, subject, subOption, qtyOption, location, desc, status, priority, assignee });
            }

            closeModal();
            render();
        }

        function deleteTicket() {
            const id = document.getElementById('t-id').value;
            if(confirm("Are you sure you want to delete this ticket?")) {
                tickets = tickets.filter(t => t.id !== id);
                closeModal();
                render();
            }
        }

        render();
    </script>
</body>
</html>
