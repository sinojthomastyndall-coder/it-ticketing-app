<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs To Do - IT Support Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase App & Database CDNs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Fixed viewport background container for mobile and desktop support */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920') no-repeat center center;
            background-size: cover;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4 min-h-screen pb-12">

    <!-- Fixed Background Overlay -->
    <div class="bg-container"></div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto space-y-6">

        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800 backdrop-blur-md gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">My Jobs To Do</h1>
                <p class="text-xs text-slate-400">IT Support Dashboard <span class="text-emerald-400 font-medium">● Live Sync</span></p>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="exportToCSV()" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-medium transition">
                    📊 Export
                </button>
                <button onclick="openModal()" class="flex-1 sm:flex-none px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition">
                    + New
                </button>
            </div>
        </header>

        <!-- Search & Filter Controls -->
        <div class="flex flex-col md:flex-row gap-4">
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="renderDashboard()" placeholder="Search by End-User Name, Asset Number, or Subject..." 
                       class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                <span class="absolute left-3 top-3.5 text-slate-500">🔍</span>
            </div>
            <div class="flex gap-2">
                <select id="dateSortInput" onchange="renderDashboard()" class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="newest">Sort: Newest First</option>
                    <option value="oldest">Sort: Oldest First</option>
                </select>
                <select id="timeFilterInput" onchange="renderDashboard()" class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="all">All Time</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                </select>
            </div>
        </div>

        <!-- Charts Dashboard Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 backdrop-blur-md">
                <h3 class="text-sm font-semibold text-slate-300 mb-1">Overall Ticket Breakdown</h3>
                <p class="text-xs text-slate-500 mb-4">Filtered status counts</p>
                <div class="h-52">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 backdrop-blur-md">
                <h3 class="text-sm font-semibold text-slate-300 mb-1">Status Distribution</h3>
                <p class="text-xs text-slate-500 mb-4">Proportional breakdown of open & active jobs</p>
                <div class="h-52 flex justify-center">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Metric Counter Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
            <div onclick="setFilter('All')" class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center cursor-pointer hover:border-indigo-500 transition">
                <div id="cnt-all" class="text-xl font-bold text-slate-100">0</div>
                <div class="text-xs text-slate-400 mt-1">All</div>
            </div>
            <div onclick="setFilter('Open')" class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center cursor-pointer hover:border-amber-500 transition">
                <div id="cnt-open" class="text-xl font-bold text-amber-400">0</div>
                <div class="text-xs text-slate-400 mt-1">Open</div>
            </div>
            <div onclick="setFilter('Waiting')" class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center cursor-pointer hover:border-purple-500 transition">
                <div id="cnt-waiting" class="text-xl font-bold text-purple-400">0</div>
                <div class="text-xs text-slate-400 mt-1">Waiting</div>
            </div>
            <div onclick="setFilter('In Progress')" class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center cursor-pointer hover:border-blue-500 transition">
                <div id="cnt-progress" class="text-xl font-bold text-blue-400">0</div>
                <div class="text-xs text-slate-400 mt-1">In Prog.</div>
            </div>
            <div onclick="setFilter('Resolved')" class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center cursor-pointer hover:border-emerald-500 transition">
                <div id="cnt-resolved" class="text-xl font-bold text-emerald-400">0</div>
                <div class="text-xs text-slate-400 mt-1">Resolved</div>
            </div>
            <div onclick="setFilter('Today')" class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-center cursor-pointer hover:border-cyan-500 transition">
                <div id="cnt-today" class="text-xl font-bold text-cyan-400">0</div>
                <div class="text-xs text-slate-400 mt-1">Today's Res.</div>
            </div>
        </div>

        <!-- Ticket Cards List -->
        <div class="space-y-4">
            <h2 class="text-lg font-bold text-slate-200">Active Tickets</h2>
            <div id="ticketsList" class="space-y-3">
                <!-- Tickets will render dynamically here -->
            </div>
        </div>

    </div>

    <!-- Create/Edit Ticket Modal -->
    <div id="ticketModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="font-bold text-slate-200">New Support Ticket</h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-slate-300">✕</button>
            </div>
            <form id="ticketForm" onsubmit="saveTicket(event)" class="space-y-3">
                <input type="hidden" id="ticketId">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Subject / Issue Title</label>
                    <input type="text" id="subject" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">End-User Name</label>
                    <input type="text" id="endUser" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Location / Room</label>
                        <input type="text" id="location" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Asset Tag #</label>
                        <input type="text" id="assetTag" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Created Date</label>
                    <input type="date" id="createdDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
                    <select id="status" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="Open">Open</option>
                        <option value="Waiting for Email Response/License Information">Waiting for Email Response/License Information</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Today's Resolved">Today's Resolved</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Resolution / Notes</label>
                    <textarea id="resolution" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm">Cancel</button>
                    <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium">Save Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://it-ticketing-app-72f0e-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Application State
        let tickets = {};
        let activeStatusFilter = 'All';
        let barChartInstance = null;
        let pieChartInstance = null;

        // Fetch tickets from Firebase in real-time
        db.ref('tickets').on('value', (snapshot) => {
            tickets = snapshot.val() || {};
            renderDashboard();
        });

        // Date helper (YYYY-MM-DD)
        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        // Render Dashboard & Filters
        function renderDashboard() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const sortOrder = document.getElementById('dateSortInput').value;
            const timeFilter = document.getElementById('timeFilterInput').value;
            const todayStr = getTodayString();

            const ticketsList = document.getElementById('ticketsList');
            ticketsList.innerHTML = '';

            // Metrics Counters
            let counts = { all: 0, open: 0, waiting: 0, progress: 0, resolved: 0, today: 0 };

            // Process Tickets
            let ticketArray = Object.keys(tickets).map(key => ({ id: key, ...tickets[key] }));

            ticketArray.forEach(t => {
                const dateVal = t.createdDate || todayStr;
                const matchesTime = timeFilter === 'all' || 
                    (timeFilter === 'today' && dateVal === todayStr);

                if (matchesTime) {
                    counts.all++;
                    if (t.status === 'Open') counts.open++;
                    if (t.status === 'Waiting for Email Response/License Information') counts.waiting++;
                    if (t.status === 'In Progress') counts.progress++;
                    if (t.status === 'Resolved') counts.resolved++;
                    if (t.status === 'Today\'s Resolved' || (t.status === 'Resolved' && dateVal === todayStr)) counts.today++;
                }
            });

            // Update UI Counters
            document.getElementById('cnt-all').innerText = counts.all;
            document.getElementById('cnt-open').innerText = counts.open;
            document.getElementById('cnt-waiting').innerText = counts.waiting;
            document.getElementById('cnt-progress').innerText = counts.progress;
            document.getElementById('cnt-resolved').innerText = counts.resolved;
            document.getElementById('cnt-today').innerText = counts.today;

            // Sort Tickets by Created Date
            ticketArray.sort((a, b) => {
                const dateA = new Date(a.createdDate || 0);
                const dateB = new Date(b.createdDate || 0);
                return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
            });

            // Filter & Render Ticket Cards
            ticketArray.forEach(ticket => {
                const matchesSearch = (ticket.endUser || '').toLowerCase().includes(searchQuery) ||
                                      (ticket.assetTag || '').toLowerCase().includes(searchQuery) ||
                                      (ticket.subject || '').toLowerCase().includes(searchQuery);

                const matchesStatus = activeStatusFilter === 'All' || 
                                     (activeStatusFilter === 'Waiting' && ticket.status.includes('Waiting')) ||
                                     (activeStatusFilter === 'Today' && (ticket.status.includes('Today') || ticket.createdDate === todayStr)) ||
                                     ticket.status === activeStatusFilter;

                if (matchesSearch && matchesStatus) {
                    ticketsList.appendChild(createTicketCard(ticket));
                }
            });

            updateCharts(counts);
        }

        // Dynamic Ticket Card Generator
        function createTicketCard(ticket) {
            const div = document.createElement('div');
            div.className = "bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-2 backdrop-blur-md";

            const statusColors = {
                'Open': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                'In Progress': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
                'Resolved': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
                'Today\'s Resolved': 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20'
            };
            const badgeClass = statusColors[ticket.status] || 'bg-purple-500/10 text-purple-400 border-purple-500/20';

            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 text-xs font-semibold rounded border ${badgeClass}">${ticket.status}</span>
                        <span class="text-xs text-slate-400">📅 Created: <strong class="text-slate-200">${ticket.createdDate || 'N/A'}</strong></span>
                    </div>
                    <span class="text-xs text-slate-500 font-mono">#${ticket.id.slice(-6)}</span>
                </div>
                <h3 class="text-base font-bold text-slate-100">${ticket.subject}</h3>
                <div class="text-xs text-slate-400 flex flex-wrap gap-x-4 gap-y-1">
                    <span>👤 End User: <strong class="text-slate-200">${ticket.endUser || 'N/A'}</strong></span>
                    ${ticket.assetTag ? `<span>🏷️ Asset: <strong class="text-slate-200">${ticket.assetTag}</strong></span>` : ''}
                    ${ticket.location ? `<span>📍 Location: <strong class="text-slate-200">${ticket.location}</strong></span>` : ''}
                </div>
                ${ticket.resolution ? `
                    <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/80 text-xs text-slate-300">
                        <strong class="text-emerald-400">Resolution Note:</strong> ${ticket.resolution}
                    </div>
                ` : ''}
                <div class="pt-2 flex justify-between items-center text-xs text-slate-400">
                    <span>Assignee: <strong class="text-slate-200">${ticket.assignee || 'Sinoj Thomas'}</strong></span>
                    <button onclick="editTicket('${ticket.id}')" class="text-indigo-400 hover:text-indigo-300 font-medium">Edit Ticket</button>
                </div>
            `;
            return div;
        }

        // Set Active Filter
        function setFilter(status) {
            activeStatusFilter = status;
            renderDashboard();
        }

        // Modal Controls
        function openModal() {
            document.getElementById('ticketForm').reset();
            document.getElementById('ticketId').value = '';
            document.getElementById('createdDate').value = getTodayString();
            document.getElementById('modalTitle').innerText = 'New Support Ticket';
            document.getElementById('ticketModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('ticketModal').classList.add('hidden');
        }

        function editTicket(id) {
            const ticket = tickets[id];
            if (!ticket) return;

            document.getElementById('ticketId').value = id;
            document.getElementById('subject').value = ticket.subject || '';
            document.getElementById('endUser').value = ticket.endUser || '';
            document.getElementById('location').value = ticket.location || '';
            document.getElementById('assetTag').value = ticket.assetTag || '';
            document.getElementById('createdDate').value = ticket.createdDate || getTodayString();
            document.getElementById('status').value = ticket.status || 'Open';
            document.getElementById('resolution').value = ticket.resolution || '';

            document.getElementById('modalTitle').innerText = 'Edit Ticket #' + id.slice(-6);
            document.getElementById('ticketModal').classList.remove('hidden');
        }

        // Save Ticket (Create / Update)
        function saveTicket(e) {
            e.preventDefault();
            const id = document.getElementById('ticketId').value;
            const ticketData = {
                subject: document.getElementById('subject').value,
                endUser: document.getElementById('endUser').value,
                location: document.getElementById('location').value,
                assetTag: document.getElementById('assetTag').value,
                createdDate: document.getElementById('createdDate').value,
                status: document.getElementById('status').value,
                resolution: document.getElementById('resolution').value,
                assignee: 'Sinoj Thomas'
            };

            if (id) {
                db.ref('tickets/' + id).update(ticketData);
            } else {
                db.ref('tickets').push(ticketData);
            }

            closeModal();
        }

        // Render & Update Chart.js Visualizations
        function updateCharts(counts) {
            const barCtx = document.getElementById('barChart').getContext('2d');
            const pieCtx = document.getElementById('pieChart').getContext('2d');

            if (barChartInstance) barChartInstance.destroy();
            if (pieChartInstance) pieChartInstance.destroy();

            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['Total', 'Open', 'Waiting Info', 'In Progress', 'Resolved'],
                    datasets: [{
                        data: [counts.all, counts.open, counts.waiting, counts.progress, counts.resolved],
                        backgroundColor: ['#6366f1', '#f59e0b', '#c084fc', '#3b82f6', '#10b981'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });

            pieChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Open', 'Waiting Info', 'In Progress', 'Resolved'],
                    datasets: [{
                        data: [counts.open, counts.waiting, counts.progress, counts.resolved],
                        backgroundColor: ['#f59e0b', '#c084fc', '#3b82f6', '#10b981'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12 } }
                    }
                }
            });
        }

        // Export Tickets to CSV
        function exportToCSV() {
            let csv = 'ID,Created Date,Subject,End User,Location,Asset Tag,Status,Assignee,Resolution\n';
            Object.keys(tickets).forEach(id => {
                const t = tickets[id];
                csv += `"${id}","${t.createdDate || ''}","${t.subject || ''}","${t.endUser || ''}","${t.location || ''}","${t.assetTag || ''}","${t.status || ''}","${t.assignee || ''}","${t.resolution || ''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `IT_Tickets_Export_${getTodayString()}.csv`);
            a.click();
        }
    </script>
</body>
</html>
